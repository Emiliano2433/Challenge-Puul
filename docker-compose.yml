services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: puul
      POSTGRES_PASSWORD: puul
      POSTGRES_DB: puul
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puul"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
